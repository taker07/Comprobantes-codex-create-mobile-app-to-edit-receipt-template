<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta
      name="description"
      content="Aplicación móvil para editar plantillas de recibos, crear nuevas opciones y descargar comprobantes."
    />
    <title>Comprobantes | App móvil de recibos</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="mobile-app-bar" aria-label="Encabezado de la aplicación">
        <div>
          <span class="eyebrow">App móvil</span>
          <h1>Comprobantes</h1>
        </div>
        <span class="status-pill" id="saveStatus">Guardado local</span>
      </header>

      <main class="workspace">
        <section class="panel form-panel" aria-labelledby="form-title">
          <div class="section-heading">
            <div>
              <h2 id="form-title">Datos del recibo</h2>
              <p>Edita los campos y la plantilla desde tu teléfono.</p>
            </div>
            <button class="ghost-button" id="loadSample" type="button">Ejemplo</button>
          </div>

          <form id="receiptForm" autocomplete="on">
            <fieldset class="form-card" id="templateOptions">
              <legend>Plantilla</legend>

              <label>
                Opción de plantilla
                <select name="templateId" id="templateSelect"></select>
              </label>

              <div class="field-grid">
                <label>
                  Nombre para guardar
                  <input name="templateName" type="text" placeholder="Ej. Recibo con logo" />
                </label>
                <label>
                  Estilo visual
                  <select name="templateVariant">
                    <option value="classic">Clásica</option>
                    <option value="modern">Moderna</option>
                    <option value="compact">Compacta</option>
                  </select>
                </label>
              </div>

              <label>
                Título de la plantilla
                <input name="templateTitle" type="text" placeholder="Recibo de pago" />
              </label>

              <div class="field-grid">
                <label>
                  Texto auxiliar
                  <input name="templateSubtitle" type="text" placeholder="Comprobante digital" />
                </label>
                <label>
                  Etiqueta de firma
                  <input name="signatureLabel" type="text" placeholder="Firma autorizada" />
                </label>
              </div>

              <label>
                Color de plantilla
                <input name="accentColor" type="color" value="#1e40af" />
              </label>

              <div class="template-actions">
                <button class="secondary-button" id="saveTemplate" type="button">Añadir plantilla</button>
                <button class="danger-button" id="deleteTemplate" type="button" hidden>Eliminar</button>
              </div>
            </fieldset>

            <fieldset class="form-card">
              <legend>Información</legend>

              <label>
                Empresa o emisor
                <input name="issuer" type="text" value="Comprobantes Express" required />
              </label>

              <label>
                Identificación / NIT
                <input name="taxId" type="text" value="NIT 900.123.456-7" />
              </label>

              <div class="field-grid">
                <label>
                  N.º recibo
                  <input name="receiptNumber" type="text" value="RC-0001" required />
                </label>
                <label>
                  Fecha
                  <input name="date" type="date" required />
                </label>
              </div>

              <label>
                Recibí de
                <input name="customer" type="text" value="Cliente de prueba" required />
              </label>

              <label>
                Concepto
                <textarea name="concept" rows="3" required>Pago por servicios profesionales.</textarea>
              </label>

              <div class="field-grid">
                <label>
                  Moneda
                  <select name="currency">
                    <option value="USD">USD</option>
                    <option value="COP">COP</option>
                    <option value="MXN">MXN</option>
                    <option value="EUR">EUR</option>
                    <option value="PEN">PEN</option>
                  </select>
                </label>
                <label>
                  Importe
                  <input name="amount" type="number" min="0" step="0.01" value="150.00" required />
                </label>
              </div>

              <label>
                Método de pago
                <select name="paymentMethod">
                  <option>Transferencia bancaria</option>
                  <option>Efectivo</option>
                  <option>Tarjeta</option>
                  <option>Cheque</option>
                  <option>Otro</option>
                </select>
              </label>

              <label>
                Notas
                <textarea name="notes" rows="2">Gracias por su pago.</textarea>
              </label>
            </fieldset>
          </form>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-title">
          <div class="section-heading preview-heading">
            <div>
              <h2 id="preview-title">Vista previa</h2>
              <p id="selectedTemplateName">Plantilla clásica</p>
            </div>
          </div>

          <article class="receipt receipt--classic" id="receiptPreview" aria-live="polite">
            <div class="receipt-accent"></div>
            <header class="receipt-header">
              <div>
                <p class="receipt-label" data-preview="templateTitle">Recibo de pago</p>
                <h3 data-preview="issuer"></h3>
                <p data-preview="taxId"></p>
              </div>
              <div class="receipt-number">
                <span>N.º</span>
                <strong data-preview="receiptNumber"></strong>
              </div>
            </header>

            <p class="receipt-subtitle" data-preview="templateSubtitle">Comprobante digital</p>

            <div class="receipt-meta">
              <div>
                <span>Fecha</span>
                <strong data-preview="date"></strong>
              </div>
              <div>
                <span>Método</span>
                <strong data-preview="paymentMethod"></strong>
              </div>
            </div>

            <div class="receipt-body">
              <p>Recibí de <strong data-preview="customer"></strong> la cantidad de:</p>
              <div class="amount-box" data-preview="amount"></div>
              <p class="concept" data-preview="concept"></p>
            </div>

            <footer class="receipt-footer">
              <div class="signature-line" data-preview="signatureLabel">Firma autorizada</div>
              <p data-preview="notes"></p>
            </footer>
          </article>

          <div class="actions desktop-actions">
            <button class="primary-button" id="downloadButton" type="button">Descargar imagen</button>
            <button class="secondary-button" id="printButton" type="button">Imprimir imagen</button>
          </div>
        </section>
      </main>
    </div>

    <nav class="mobile-action-bar" aria-label="Acciones móviles">
      <a class="bar-link" href="#templateOptions">Plantilla</a>
      <button class="primary-button" id="mobileDownloadButton" type="button">Descargar imagen</button>
      <button class="secondary-button" id="mobilePrintButton" type="button">Imprimir imagen</button>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNa5a4N/xI9eQQ/rKqDwl+Uu8oDxUV+NmW8B+7iP+8NxNwRquGGg0cx1m2jB0zOczD2d5I0F1HPXT2tT73NQ9Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
